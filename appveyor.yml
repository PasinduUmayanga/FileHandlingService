version: 1.0.{build}

image: Visual Studio 2022

configuration: Release

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

cache:
  - '%USERPROFILE%\.nuget\packages -> **\*.csproj'
  - '%LOCALAPPDATA%\NuGet\v3-cache -> **\*.csproj'

before_build:
  - cmd: dotnet --info
  - cmd: dotnet restore src\FileHandlingService\FileHandlingService.sln

build_script:
  - cmd: dotnet build src\FileHandlingService\FileHandlingService.sln --configuration %CONFIGURATION% --no-restore

test: off
